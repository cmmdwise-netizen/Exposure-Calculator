<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Exposure & Dynamic Range Calculator</title>
    <!-- Standard Favicon -->
<link rel="icon" type="image/png" href="icon.png">

<!-- Apple Touch Icon (for iOS Home Screen) -->
<link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --success-hover: #059669;
            --text-color: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-color);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        .results {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .result-label {
            color: var(--text-muted);
        }

        .result-value {
            font-weight: 600;
            color: var(--text-color);
        }

        .highlight-rec {
            background-color: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--accent-color);
            padding: 10px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.875rem;
            margin-top: 16px;
            color: var(--text-color);
        }

        .gemini-link-btn {
            display: block;
            text-align: center;
            width: 100%;
            padding: 10px 12px;
            background-color: #2a2a2a;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            box-sizing: border-box;
            margin-top: 12px;
            transition: background-color 0.2s;
        }

        .gemini-link-btn:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Field Exposure & Dynamic Range Calculator</h1>
    
    <div class="input-group">
        <label for="sceneType">Scene Type</label>
        <select id="sceneType">
            <option value="sunset">Sunset / High Contrast</option>
            <option value="waterfall">Waterfall / Moving Water</option>
            <option value="landscape">General Landscape</option>
            <option value="nightscape">Nightscape / Astro</option>
        </select>
    </div>

    <div class="input-group">
        <label for="baseShutter">Base Shutter Speed (seconds)</label>
        <input type="text" id="baseShutter" value="1/15" placeholder="e.g. 1/15 or 2">
    </div>

    <div class="input-group">
        <label for="baseAperture">Aperture (f-stop)</label>
        <input type="text" id="baseAperture" value="f/11" placeholder="e.g. f/11">
    </div>

    <div class="input-group">
        <label for="baseIso">ISO</label>
        <input type="number" id="baseIso" value="64" placeholder="e.g. 64">
    </div>

    <div class="input-group">
        <label for="highlightBias">Highlight Protection Bias (EV)</label>
        <select id="highlightBias">
            <option value="-0.3">-1/3 EV (Conservative)</option>
            <option value="-0.7" selected>-2/3 EV (Standard Sunset/Bright Sky)</option>
            <option value="-1.0">-1.0 EV (Extreme Contrast)</option>
            <option value="0.0">0.0 EV (Balanced / Flat Light)</option>
        </select>
    </div>

    <button onclick="calculateExposure()">Calculate Adjusted Exposure</button>

    <div class="results" id="resultsSection" style="display: none;">
        <div class="result-item">
            <span class="result-label">Recommended Comp:</span>
            <span class="result-value" id="resComp">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">Target Shutter Speed:</span>
            <span class="result-value" id="resShutter">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">Suggested Aperture:</span>
            <span class="result-value" id="resAperture">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">Optimized ISO:</span>
            <span class="result-value" id="resIso">-</span>
        </div>
        <div class="highlight-rec" id="resTip">
            <!-- Dynamic tip goes here -->
        </div>

        <!-- Action Buttons -->
        <button onclick="copyResults()" class="btn-success" style="margin-top: 16px;">Copy Results to Clipboard</button>
        <a href="https://gemini.google.com" target="_blank" class="gemini-link-btn">💬 Ask Gemini for Field Advice</a>
    </div>
</div>

<script>
    function parseShutter(val) {
        val = val.trim();
        if (val.includes('/')) {
            let parts = val.split('/');
            return parseFloat(parts[0]) / parseFloat(parts[1]);
        }
        return parseFloat(val);
    }

    function formatShutter(seconds) {
        if (seconds >= 1) {
            return seconds.toFixed(1) + "s";
        } else {
            let denom = Math.round(1 / seconds);
            return "1/" + denom + "s";
        }
    }

    function calculateExposure() {
        let scene = document.getElementById('sceneType').value;
        let shutterInput = document.getElementById('baseShutter').value;
        let apertureInput = document.getElementById('baseAperture').value;
        let isoInput = parseInt(document.getElementById('baseIso').value);
        let bias = parseFloat(document.getElementById('highlightBias').value);

        let baseSeconds = parseShutter(shutterInput);
        
        // Apply exposure bias adjustment for highlight protection
        let factor = Math.pow(2, bias);
        let adjustedSeconds = baseSeconds * factor;

        let tipText = "";
        if (scene === 'sunset') {
            tipText = "<strong>Tip:</strong> Watch the live histogram closely. Clipping highlights in the sun or bright clouds is irreversible in post; protect the highlights and lift shadows later.";
        } else if (scene === 'waterfall') {
            tipText = "<strong>Tip:</strong> If using a neutral density (ND) filter for long exposure, multiply your base shutter speed accordingly after applying this compensation.";
        } else if (scene === 'nightscape') {
            tipText = "<strong>Tip:</strong> Ensure optical stabilization is turned off when shooting on a sturdy tripod, and rely on manual focus magnifier.";
        } else {
            tipText = "<strong>Tip:</strong> Keep an eye on your blinkies to ensure shadow noise remains manageable while retaining highlight details.";
        }

        // Display results
        document.getElementById('resultsSection').style.display = 'block';
        document.getElementById('resComp').innerText = bias + " EV";
        document.getElementById('resShutter').innerText = formatShutter(adjustedSeconds);
        document.getElementById('resAperture').innerText = apertureInput;
        document.getElementById('resIso').innerText = isoInput;
        document.getElementById('resTip').innerHTML = tipText;
    }

    function copyResults() {
        let comp = document.getElementById('resComp').innerText;
        let shutter = document.getElementById('resShutter').innerText;
        let aperture = document.getElementById('resAperture').innerText;
        let iso = document.getElementById('resIso').innerText;

        let summary = `--- Field Exposure Results ---\n` +
                      `Comp: ${comp}\n` +
                      `Shutter: ${shutter}\n` +
                      `Aperture: ${aperture}\n` +
                      `ISO: ${iso}`;

        navigator.clipboard.writeText(summary).then(() => {
            alert("Results copied to clipboard!");
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    }
</script>

</body>
</html>
