<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Exposure Calculator</title>
    <!-- PWA / Home Screen Icon Link -->
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #d4af37; /* Elegant gold accent for fine art photography */
            --border-color: #333333;
            --input-bg: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #b0b0b0;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .results-card {
            background: #161616;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .results-card h3 {
            margin: 0 0 5px 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .output-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Wise Impressions Field Calculator</h2>

        <!-- Base Meter Reading / Shutter Speed -->
        <div class="input-group">
            <label for="baseShutter">Metered Shutter Speed (seconds):</label>
            <select id="baseShutter">
                <option value="0.001">1/1000s</option>
                <option value="0.002">1/500s</option>
                <option value="0.004">1/250s</option>
                <option value="0.008" selected>1/125s</option>
                <option value="0.016">1/60s</option>
                <option value="0.033">1/30s</option>
                <option value="0.067">1/15s</option>
                <option value="0.125">1/8s</option>
                <option value="0.25">1/4s</option>
                <option value="0.5">1/2s</option>
                <option value="1">1s</option>
                <option value="2">2s</option>
                <option value="4">4s</option>
                <option value="8">8s</option>
                <option value="15">15s</option>
                <option value="30">30s</option>
            </select>
        </div>

        <!-- Filters & Optics Section -->
        <div class="input-group" style="border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px;">
            <label style="font-weight: 600; color: var(--accent-color); margin-bottom: 8px;">Filters & Optics</label>
            
            <!-- Polarizer Toggle -->
            <div style="display: flex; align-items: center; margin-bottom: 12px;">
                <input type="checkbox" id="cplFilter" style="width: 18px; height: 18px; margin-right: 8px; accent-color: var(--accent-color); cursor: pointer;">
                <label for="cplFilter" style="font-weight: normal; margin-bottom: 0; cursor: pointer; color: var(--text-color);">Circular Polarizer (CPL) [ +1 Stop ]</label>
            </div>

            <!-- ND Filter Selection -->
            <label for="ndFilter">Neutral Density (ND) Filter:</label>
            <select id="ndFilter">
                <option value="0">None (0 Stops)</option>
                <option value="3">3-Stop ND (ND8)</option>
                <option value="6">6-Stop ND (ND64)</option>
                <option value="10" selected>10-Stop ND (ND1000)</option>
                <option value="15">15-Stop ND (ND32000)</option>
            </select>
        </div>

        <!-- Final Results Box -->
        <div class="results-card">
            <h3>Calculated Exposure</h3>
            <p class="output-value" id="finalResult">--</p>
        </div>
    </div>

    <script>
        function calculateExposure() {
            // 1. Get base metered shutter speed
            let baseTime = parseFloat(document.getElementById('baseShutter').value);

            // 2. Calculate total filter stops
            let filterStops = 0;
            if (document.getElementById('cplFilter').checked) {
                filterStops += 1; // CPL adds 1 stop
            }
            filterStops += parseInt(document.getElementById('ndFilter').value) || 0;

            // 3. Apply stops math (each stop doubles the exposure time)
            let finalTime = baseTime * Math.pow(2, filterStops);

            // 4. Format and display result cleanly
            let outputText = "";
            if (finalTime >= 1) {
                outputText = finalTime.toFixed(1).replace(/\.0$/, '') + " seconds";
            } else {
                let fraction = Math.round(1 / finalTime);
                outputText = "1/" + fraction + "s";
            }

            document.getElementById('finalResult').innerText = outputText;
        }

        // Attach event listeners to instantly recalculate on any change
        document.getElementById('baseShutter').addEventListener('change', calculateExposure);
        document.getElementById('cplFilter').addEventListener('change', calculateExposure);
        document.getElementById('ndFilter').addEventListener('change', calculateExposure);

        // Run calculation immediately on load
        calculateExposure();
    </script>
</body>
</html>
